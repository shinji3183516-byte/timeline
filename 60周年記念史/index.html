<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高岡工場60周年記念史｜序章・1966〜1968年章</title>
<style>
/* ================================================================
   高岡工場60周年記念史 ― 序章　自動演出エンジン v5
   画像・音声はassetsフォルダ参照／完全オフライン／外部ライブラリ・CDN不使用
   写真・音声はassetsフォルダに分離（GitHub Pages対応）
   ================================================================ */
:root{
  --bg:#06080c;
  --fg:#f4f6f9;
  --sub:#98a3b3;
  --accent:#e0112b;
  --sepia:#c9a06a;
  --line:#232b38;
  --ink:#2b2620;
  --ease:cubic-bezier(.16,.84,.32,1);
  --p-site:url('assets/images/image_01.jpg');
  --p-1966:url('assets/images/image_02.jpg');
  --p-now:url('assets/images/image_03.jpg');
  --p-hero:url('assets/images/image_04.jpg');
  --p-side:url('assets/images/image_01.png');
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;background:var(--bg)}
body{height:100%;overflow:hidden;background:transparent}
body{
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased;cursor:pointer;
}

/* ================= 背景レイヤー ================= */
#photoLayer{position:fixed;inset:0;z-index:-5;overflow:hidden;background:#06080c}
#stage{background:transparent}
#photoLayer .ph{
  position:absolute;inset:-7%;
  background-size:cover;background-position:center 45%;
  opacity:0;transition:opacity 1.8s var(--ease),filter 1.8s var(--ease);
  animation:kenburns 38s ease-in-out infinite alternate;
  transform-origin:56% 46%;
}
@keyframes kenburns{0%{transform:scale(1.06)}100%{transform:scale(1.24) translate(-2.4%,-1.5%)}}
#tint{position:fixed;inset:0;z-index:-4;pointer-events:none;mix-blend-mode:soft-light;opacity:0;
  background:linear-gradient(160deg,rgba(201,160,106,.18),rgba(8,12,18,.55) 48%,rgba(224,17,43,.12));
  transition:opacity 1.6s var(--ease)}
#wash{position:fixed;inset:0;z-index:-4;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,rgba(22,32,46,.32) 0%,rgba(6,8,12,.93) 68%);
  transition:background 1.8s var(--ease)}
#vignette{position:fixed;inset:0;z-index:-3;pointer-events:none;
  box-shadow:inset 0 0 min(26vw,330px) rgba(0,0,0,.94)}
#grain{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.2;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
  animation:drift 9s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:0 60px}}
#dust{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.5}
.mote{position:absolute;border-radius:50%;background:rgba(255,240,215,.55);animation:float linear infinite}
@keyframes float{
  0%{transform:translate3d(0,110vh,0) scale(.6);opacity:0}
  12%{opacity:.85}88%{opacity:.55}
  100%{transform:translate3d(6vw,-12vh,0) scale(1.15);opacity:0}}

/* ================= ペーパーモード（カタログ紙面） ================= */
#paper{position:fixed;inset:0;z-index:-3;opacity:0;pointer-events:none;
  transition:opacity 1.4s var(--ease);
  background:radial-gradient(120% 90% at 50% 10%,#f6f2e9 0%,#ded6c6 60%,#c8bfad 100%)}
#paper:after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:repeating-linear-gradient(0deg,rgba(120,105,80,.07) 0 1px,transparent 1px 4px),
                   repeating-linear-gradient(90deg,rgba(120,105,80,.05) 0 1px,transparent 1px 5px)}
body.papermode{--fg:var(--ink);--sub:#6b6152;--line:#bcb2a0}
body.papermode #vignette{box-shadow:inset 0 0 min(24vw,300px) rgba(120,100,70,.45)}
body.papermode #grain{opacity:.10;mix-blend-mode:multiply}
body.papermode #dust{opacity:.18;mix-blend-mode:multiply}
body.papermode .shadowtext{text-shadow:none}

/* ================= ステージ ================= */
#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:8vh 7vw;
  opacity:0;visibility:hidden;transition:opacity .95s var(--ease),visibility .95s}
.scene.active{opacity:1;visibility:visible}

/* ================= 文字パーツ ================= */
.eyebrow{font-size:clamp(11px,1.02vw,15px);letter-spacing:.44em;color:var(--sepia);
  font-weight:700;margin-bottom:2.4vh}
.eyebrow.red{color:var(--accent)}
body.papermode .eyebrow{color:#a3762f}
.year{font-size:clamp(58px,11.5vw,200px);font-weight:800;line-height:.9;letter-spacing:.03em;
  background:linear-gradient(180deg,#fff 18%,#7b8595 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(29px,4.7vw,78px);font-weight:800;line-height:1.26}
h2{font-size:clamp(21px,3.2vw,52px);font-weight:700;line-height:1.36}
.lead{font-size:clamp(15px,1.5vw,25px);color:#c3ccd8;line-height:1.95;margin-top:2.6vh;max-width:44em}
body.papermode .lead{color:#4d453a}
.note{font-size:clamp(10px,.8vw,13px);color:#68738a;margin-top:3.4vh;line-height:1.75;max-width:64em}
body.papermode .note{color:#7d7466}
.center{text-align:center}.left{text-align:left}
.shadowtext{text-shadow:0 4px 42px rgba(0,0,0,.92),0 1px 3px rgba(0,0,0,.85)}

.rise{opacity:0;transform:translateY(28px)}
.scene.active .rise{animation:rise 1s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.blur{opacity:0;filter:blur(14px);transform:scale(1.04)}
.scene.active .blur{animation:unblur 1.4s var(--ease) forwards}
@keyframes unblur{to{opacity:1;filter:blur(0);transform:none}}
.scene.active .d1{animation-delay:.15s}.scene.active .d2{animation-delay:.42s}
.scene.active .d3{animation-delay:.70s}.scene.active .d4{animation-delay:1.00s}
.scene.active .d5{animation-delay:1.34s}.scene.active .d6{animation-delay:1.70s}

.rule{width:2px;height:0;background:var(--accent);margin:3vh auto;box-shadow:0 0 22px var(--accent)}
.scene.active .rule{animation:grow 1.1s var(--ease) .35s forwards}
@keyframes grow{to{height:9vh}}
.hrule{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--sepia),transparent);margin:3vh auto}
.scene.active .hrule{animation:groww 1.4s var(--ease) .4s forwards}
@keyframes groww{to{width:min(560px,72vw)}}

/* ================= 走るカローラ（側面・透過／右→左） ================= */
#car{position:fixed;bottom:12vh;right:-46vw;width:min(40vw,560px);z-index:6;
  background-size:contain;background-repeat:no-repeat;background-position:bottom center;
  aspect-ratio:1500/570;opacity:0;pointer-events:none;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.72))}
#car.dark{filter:drop-shadow(0 20px 26px rgba(0,0,0,.8)) brightness(.92) contrast(1.05)}
#car.drive{animation:drive 9.5s cubic-bezier(.26,.6,.3,1) forwards}
@keyframes drive{0%{right:-46vw;opacity:0}8%{opacity:1}58%{right:26vw}100%{right:112vw;opacity:1}}
#car.park{animation:park 2.8s var(--ease) forwards}
@keyframes park{0%{right:-46vw;opacity:0}18%{opacity:1}100%{right:16vw;opacity:1}}
#car.slow{animation:slowdrive 16s linear forwards}
@keyframes slowdrive{0%{right:-46vw;opacity:0}6%{opacity:1}100%{right:114vw;opacity:1}}
#road{position:fixed;bottom:9vh;left:0;right:0;height:22vh;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(52% 100% at 50% 100%,rgba(224,17,43,.18),transparent 72%);
  transition:opacity 1.2s ease}

/* ================= 数値 ================= */
.metric{display:flex;align-items:baseline;gap:.3em;justify-content:center}
.num{font-size:clamp(50px,10vw,164px);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 52px rgba(224,17,43,.34),0 4px 30px rgba(0,0,0,.8)}
body.papermode .num{text-shadow:none}
.unit{font-size:clamp(17px,2.3vw,38px);font-weight:700;color:var(--sub)}
.metricrow{display:flex;gap:clamp(26px,7vw,108px);align-items:flex-end;flex-wrap:wrap;justify-content:center}
.metricrow .cap{font-size:clamp(11px,1.1vw,17px);color:var(--sub);letter-spacing:.18em;
  margin-bottom:1.4vh;text-align:center}
.arrow{font-size:clamp(24px,3vw,46px);color:var(--accent);align-self:center}
.badge{display:inline-block;margin-top:3vh;padding:.62em 1.6em;border:1px solid var(--accent);
  border-radius:999px;font-weight:700;letter-spacing:.1em;font-size:clamp(13px,1.3vw,20px);
  background:rgba(224,17,43,.10);backdrop-filter:blur(6px);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 24px rgba(224,17,43,0)}100%{box-shadow:0 0 0 0 rgba(224,17,43,0)}}

/* ================= グラフ ================= */
.chartwrap{width:min(1060px,88vw);margin-top:3vh}
svg{width:100%;height:auto;overflow:visible}
.axis{stroke:#333d4d;stroke-width:1}
.gridline{stroke:#1a2130;stroke-width:1}
.tick{fill:#77839a;font-size:13px;font-family:inherit}
.plotline{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 14px rgba(224,17,43,.6))}
.area{fill:url(#ag);opacity:0}
.dot{fill:#fff;stroke:var(--accent);stroke-width:3;opacity:0}
.dotlabel{fill:#fff;font-size:15px;font-weight:700;opacity:0;font-family:inherit}
.marker{stroke:var(--sepia);stroke-width:1.5;stroke-dasharray:5 5;opacity:0}
.markertext{fill:var(--sepia);font-size:14px;font-weight:700;opacity:0;font-family:inherit}

/* ================= 比較バー ================= */
.bars{display:flex;gap:clamp(26px,6vw,80px);align-items:flex-end;justify-content:center;
  height:30vh;margin-top:3vh}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .stick{width:clamp(58px,8vw,120px);height:0;border-radius:8px 8px 0 0;transition:height 1.6s var(--ease)}
.bar.income .stick{background:linear-gradient(180deg,#cfa76e,#5d4526)}
.bar.car .stick{background:linear-gradient(180deg,var(--accent),#5e0913);box-shadow:0 0 44px rgba(224,17,43,.4)}
.bar .val{font-size:clamp(18px,2.2vw,34px);font-weight:800;margin-bottom:1.2vh}
.bar .lbl{font-size:clamp(11px,1.1vw,17px);color:var(--sub);margin-top:1.5vh;letter-spacing:.1em}

/* ================= フロー・カード ================= */
.flow{display:flex;align-items:center;gap:clamp(7px,1.5vw,20px);flex-wrap:wrap;
  justify-content:center;margin-top:3.6vh}
.node{padding:1.5vh 1.5vw;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.045);backdrop-filter:blur(8px);
  font-size:clamp(12px,1.25vw,20px);font-weight:700;white-space:nowrap;
  opacity:0;transform:translateY(14px) scale(.96)}
.scene.active .node{animation:pop .75s var(--ease) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.node.last{border-color:var(--accent);background:rgba(224,17,43,.16);box-shadow:0 0 34px rgba(224,17,43,.32)}
.sep{color:var(--accent);font-size:clamp(14px,1.7vw,26px);opacity:0}
.scene.active .sep{animation:pop .75s var(--ease) forwards}
.plus{display:flex;align-items:center;gap:clamp(16px,4vw,56px);flex-wrap:wrap;
  justify-content:center;margin-top:2.6vh}
.card{border:1px solid var(--line);border-radius:16px;padding:3.2vh 2.6vw;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  backdrop-filter:blur(10px);min-width:min(290px,74vw)}
.card .k{font-size:clamp(10px,.95vw,14px);letter-spacing:.32em;color:var(--sepia);font-weight:700}
.card .v{font-size:clamp(21px,2.6vw,42px);font-weight:800;margin-top:1.4vh}

/* ================= 写真フレーム（ワイプ登場） ================= */
.split{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(20px,4vw,60px);
  align-items:center;width:min(1200px,92vw)}
.frame{position:relative;border-radius:3px;overflow:hidden;aspect-ratio:16/10;
  box-shadow:0 30px 70px rgba(0,0,0,.72);border:1px solid rgba(201,160,106,.3);background:#0b0f16}
.frame i{position:absolute;inset:0;background-size:cover;background-position:center 46%;
  transform:scale(1.12);clip-path:inset(0 100% 0 0)}
.scene.active .frame i{animation:wipe 1.7s var(--ease) .5s forwards,slowzoom 22s ease-out .5s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes slowzoom{to{transform:scale(1)}}
.frame b{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sepia);
  box-shadow:0 0 26px var(--sepia)}
.scene.active .frame b{animation:sweep 1.7s var(--ease) .5s forwards}
@keyframes sweep{0%{left:0;opacity:1}99%{left:100%;opacity:1}100%{opacity:0}}
.cap{font-size:clamp(10px,.82vw,13px);color:#6f7b90;margin-top:1.2vh;letter-spacing:.05em;line-height:1.75}
body.papermode .cap{color:#7d7466}
.stat{font-size:clamp(34px,5.4vw,88px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  color:#fff;text-shadow:0 0 40px rgba(201,160,106,.35)}
.statsub{font-size:clamp(12px,1.15vw,18px);color:var(--sub);letter-spacing:.14em;margin-top:1vh}

/* ================= カタログ紙面（カローラ・切り抜きなし） ================= */
.plate{width:min(1180px,92vw);display:grid;grid-template-columns:1.35fr .65fr;
  gap:clamp(18px,3vw,48px);align-items:center}
.platephoto{position:relative;aspect-ratio:720/510;overflow:hidden;
  border:1px solid rgba(120,100,70,.35);
  box-shadow:0 26px 60px rgba(90,74,48,.34),inset 0 0 60px rgba(150,130,95,.18);
  background:#f3efe6}
.platephoto i{position:absolute;inset:0;background-size:cover;background-position:center;
  mix-blend-mode:multiply;filter:sepia(.34) contrast(1.06);transform:scale(1.05);opacity:0}
.scene.active .platephoto i{animation:fadezoom 2.4s var(--ease) .45s forwards}
@keyframes fadezoom{to{opacity:1;transform:scale(1)}}
.platephoto .stamp{position:absolute;right:2.4%;bottom:4%;
  font-size:clamp(9px,.78vw,12px);letter-spacing:.24em;color:#8a7a5e;font-weight:700}
.spec{border-top:1px solid rgba(120,100,70,.4);border-bottom:1px solid rgba(120,100,70,.4);
  padding:2vh 0;margin-top:2.4vh}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:1.1vh 1.4vw;font-size:clamp(11px,1.05vw,16px)}
.spec dt{color:#8a7a5e;letter-spacing:.14em;font-weight:700;white-space:nowrap}
.spec dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.plate h2{color:var(--ink)}

/* ================= 1966→2026 ワイプ比較 ================= */
.compare{position:relative;width:min(1180px,92vw);aspect-ratio:16/10;overflow:hidden;
  border-radius:3px;border:1px solid rgba(201,160,106,.32);
  box-shadow:0 34px 80px rgba(0,0,0,.75);background:#0b0f16;cursor:ew-resize}
.compare .layer{position:absolute;inset:0;background-size:cover;background-position:center}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;
  box-shadow:0 0 26px rgba(255,255,255,.85);z-index:3;transform:translateX(-1px)}
.compare .handle:after{content:"◀ ▶";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);background:rgba(10,12,16,.82);border:1px solid rgba(255,255,255,.5);
  border-radius:999px;padding:.5em .85em;font-size:clamp(9px,.85vw,13px);letter-spacing:.08em;
  font-weight:700;white-space:nowrap;color:#fff}
.compare .lab{position:absolute;bottom:0;padding:1.2vh 1.4vw;font-size:clamp(10px,.95vw,15px);
  font-weight:700;letter-spacing:.16em;z-index:2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.compare .lab.l{left:0}.compare .lab.r{right:0}
.compare .lab .s{display:block;font-size:.72em;letter-spacing:.1em;color:#c9d2df;
  font-weight:400;margin-top:.4em}
.bignum{font-size:clamp(46px,8vw,140px);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ================= 年表レール ================= */
.rail{display:flex;width:min(1080px,92vw);margin-top:4vh;
  border-top:1px solid var(--line);padding-top:2.4vh}
.rail .stop{flex:1;position:relative;padding:0 1vw;text-align:center;opacity:0;transform:translateY(12px)}
.scene.active .rail .stop{animation:pop .8s var(--ease) forwards}
.rail .stop:before{content:"";position:absolute;top:-2.4vh;left:50%;width:9px;height:9px;
  border-radius:50%;background:var(--sepia);transform:translate(-50%,-50%)}
.rail .stop.hot:before{background:var(--accent);box-shadow:0 0 18px var(--accent)}
.rail .y{font-size:clamp(13px,1.35vw,21px);font-weight:800;color:#fff}
.rail .t{font-size:clamp(10px,.92vw,14px);color:var(--sub);margin-top:.7vh;line-height:1.6}

/* ================= UI ================= */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:13px 22px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));
  font-size:12px;color:#98a3b3;letter-spacing:.08em}
body.papermode #hud{background:linear-gradient(180deg,transparent,rgba(90,76,52,.55));color:#efe9dd}
#hud button{background:rgba(255,255,255,.08);color:#f4f6f9;border:1px solid rgba(255,255,255,.16);
  border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
#hud button:hover{background:var(--accent);border-color:var(--accent)}
#counter{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;
  background:linear-gradient(90deg,var(--sepia),var(--accent));transition:width .45s linear}
#brand{position:fixed;top:16px;left:24px;z-index:20;font-size:11px;letter-spacing:.38em;
  color:#5f6a7d;font-weight:700}
#hint{position:fixed;top:16px;right:24px;z-index:20;font-size:11px;letter-spacing:.14em;color:#5f6a7d}
body.papermode #brand,body.papermode #hint{color:#a1957e}
@media(max-width:760px){
  .split,.plate{grid-template-columns:1fr}
  #hud{font-size:10px;gap:7px;padding:10px 12px}#hud button{padding:7px 10px}
  #brand,#hint{display:none}
  .rail{flex-wrap:wrap}.rail .stop{flex:0 0 50%;margin-bottom:2vh}
  #car{width:min(62vw,420px)}
}

/* ================================================================
   [ADD-2] 1966年章　実写真（Base64内包・完全オフライン）
   ※ 序章01〜17のCSSは一切変更していません（追記のみ）
   ================================================================ */
:root{
  --y66-gate:url('assets/images/image_05.jpg');
  --y66-airw:url('assets/images/image_06.jpg');
  --y66-airn:url('assets/images/image_07.jpg');
  --y66-line:url('assets/images/image_08.jpg');
  --y66-one:url('assets/images/image_09.jpg');
  --y66-car:url('assets/images/image_10.jpg');
}

/* --- 全面背景写真（シーン内で完結／演出エンジン非改変） --- */
.bleed66{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 50%;
  transform:scale(1.12);opacity:0;filter:grayscale(1) contrast(1.1) brightness(.5)}
.scene.active .bleed66{animation:bleedIn 2s var(--ease) forwards,slowzoom 26s ease-out forwards}
@keyframes bleedIn{to{opacity:1}}
.bleed66:after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 32%,rgba(12,18,28,.3) 0%,rgba(6,8,12,.94) 72%)}
/* --- 橋渡し（1966スタンプ＋縦年表） --- */
.bridge{width:min(1240px,92vw);display:grid;grid-template-columns:.78fr 1.22fr;
  gap:clamp(24px,5vw,72px);align-items:center}
.bridge .stamp{font-size:clamp(96px,17vw,250px);font-weight:900;line-height:.76;
  letter-spacing:-.07em;color:transparent;-webkit-text-stroke:2px rgba(224,17,43,.82);
  text-shadow:0 0 80px rgba(224,17,43,.16)}
.bridge .stampsub{margin-top:2.2vh;font-size:clamp(11px,1.05vw,16px);color:var(--sepia);
  letter-spacing:.3em;font-weight:800;text-align:center}
.tl{position:relative;border-left:2px solid var(--accent);padding-left:clamp(22px,3vw,46px)}
.tl .ev{position:relative;margin:0 0 clamp(15px,2.8vh,32px);opacity:0;transform:translateX(26px)}
.scene.active .tl .ev{animation:tlIn .72s var(--ease) forwards}
@keyframes tlIn{to{opacity:1;transform:none}}
.tl .ev:before{content:"";position:absolute;left:calc(-1 * clamp(22px,3vw,46px) - 7px);top:.45em;
  width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent)}
.tl .ev.dim:before{background:var(--sepia);box-shadow:0 0 14px rgba(201,160,106,.7)}
.tl time{display:block;color:var(--sepia);font-size:clamp(11px,.98vw,15px);
  letter-spacing:.2em;font-weight:800}
.tl h3{font-size:clamp(18px,2.3vw,35px);line-height:1.32;margin:.5vh 0 0;font-weight:800}
/* --- 完成ゲート 大判（唯一のカラー写真を主役に） --- */
.gate{width:min(1240px,92vw);display:grid;grid-template-columns:1.3fr .7fr;
  gap:clamp(22px,4vw,58px);align-items:center}
.gatephoto{position:relative;aspect-ratio:724/482;overflow:hidden;border-radius:3px;
  border:1px solid rgba(201,160,106,.34);box-shadow:0 34px 84px rgba(0,0,0,.76)}
.gatephoto i{position:absolute;inset:0;background-size:cover;background-position:center 52%;
  transform:scale(1.13);clip-path:inset(0 100% 0 0)}
.scene.active .gatephoto i{animation:wipe 1.8s var(--ease) .45s forwards,
  slowzoom 26s ease-out .45s forwards}
.gatephoto b{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sepia);
  box-shadow:0 0 26px var(--sepia)}
.scene.active .gatephoto b{animation:sweep 1.8s var(--ease) .45s forwards}
/* --- 縦写真（1号車ラインオフ） --- */
.duo{width:min(1240px,92vw);display:grid;grid-template-columns:.86fr 1.14fr;
  gap:clamp(22px,4vw,60px);align-items:center}
.tallphoto{position:relative;aspect-ratio:640/929;max-height:70vh;margin:0 auto;overflow:hidden;
  border-radius:3px;border:1px solid rgba(201,160,106,.32);box-shadow:0 30px 74px rgba(0,0,0,.74)}
.tallphoto i{position:absolute;inset:0;background-size:cover;background-position:center 46%;
  transform:scale(1.12);clip-path:inset(100% 0 0 0);filter:grayscale(1) contrast(1.08)}
.scene.active .tallphoto i{animation:wipeUp 1.9s var(--ease) .5s forwards,
  slowzoom 26s ease-out .5s forwards}
@keyframes wipeUp{to{clip-path:inset(0 0 0 0)}}
/* --- 年表 1966年 写真グリッド --- */
.y66{width:min(1300px,94vw)}
.head66{display:flex;align-items:flex-end;gap:clamp(16px,3vw,46px);flex-wrap:wrap}
.huge66{font-size:clamp(56px,9.2vw,148px);font-weight:900;line-height:.84;letter-spacing:-.045em;
  color:var(--accent);text-shadow:0 0 60px rgba(224,17,43,.34);font-variant-numeric:tabular-nums}
.grid66{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(9px,1.2vw,17px);margin-top:3.2vh}
.sh{position:relative;overflow:hidden;border-radius:3px;background:#0b0f16;aspect-ratio:4/3;
  border:1px solid rgba(201,160,106,.3);box-shadow:0 20px 50px rgba(0,0,0,.66);
  opacity:0;transform:translateY(20px)}
.scene.active .sh{animation:shIn .85s var(--ease) forwards}
@keyframes shIn{to{opacity:1;transform:none}}
.sh i{position:absolute;inset:0;background-size:cover;background-position:center 50%;
  transform:scale(1.09);filter:grayscale(1) contrast(1.06)}
.scene.active .sh i{animation:slowzoom 28s ease-out forwards}
.sh.color i{filter:none}
.sh:after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 44%,rgba(4,6,10,.92))}
.sh .tag{position:absolute;left:12px;right:12px;bottom:11px;z-index:2;
  font-size:clamp(10px,.84vw,13px);letter-spacing:.12em;font-weight:800;color:#eef1f6;
  line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.95)}
.sh .tag small{display:block;font-weight:700;color:var(--sepia);letter-spacing:.2em;
  font-size:.8em;margin-bottom:.25em}
.enter66{display:inline-block;margin-top:3vh;padding:.8em 1.7em;border:1px solid var(--accent);
  border-radius:999px;background:rgba(224,17,43,.14);font-weight:800;letter-spacing:.12em;
  font-size:clamp(12px,1.18vw,18px);backdrop-filter:blur(6px);
  animation:pulse 2.6s ease-out infinite}
@media(max-width:900px){
  .bridge,.gate,.duo{grid-template-columns:1fr}
  .bridge .stamp{text-align:center}
  .grid66{grid-template-columns:1fr 1fr}
  .tallphoto{max-height:44vh}
}

/* ================================================================
   [ADD-3] 1967年章  ドキュメンタリー・パート
   ※ 序章01〜17 / 1966年章18〜22 のCSSは一切変更していません（追記のみ）
   ================================================================ */
:root{
  --y67-gt:url('assets/images/image_11.jpg');
  --y67-pub:url('assets/images/image_12.jpg');
  --y67-air:url('assets/images/image_13.jpg');
  --y67-cor:url('assets/images/image_14.jpg');
}

/* --- 章の区切り（黒みへ落とす静かな扉） --- */
.chapmark{text-align:center}
.chapmark .no{font-size:clamp(10px,.9vw,14px);letter-spacing:.5em;color:var(--sepia);font-weight:800}
.chapmark .yr{font-size:clamp(70px,13vw,210px);font-weight:900;line-height:.9;letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:2px rgba(201,160,106,.8);
  text-shadow:0 0 90px rgba(201,160,106,.16);font-variant-numeric:tabular-nums;margin-top:1.6vh}
.chapmark .ttl{font-size:clamp(17px,2.2vw,34px);font-weight:800;margin-top:2.6vh;line-height:1.4}

/* --- ナレーション（字幕風・一行ずつ立ち上がる） --- */
.narr{max-width:40em;margin:0 auto;text-align:center}
.narr p{font-size:clamp(15px,1.62vw,27px);line-height:2.05;color:#dfe5ee;
  opacity:0;transform:translateY(16px);text-shadow:0 3px 30px rgba(0,0,0,.9);margin-bottom:1.4vh}
.scene.active .narr p{animation:rise 1.05s var(--ease) forwards}
body.papermode .narr p{color:#4d453a;text-shadow:none}

/* --- 横長の車両カット（ワイプ登場） --- */
.widecar{position:relative;width:min(1240px,92vw);aspect-ratio:1920/778;overflow:hidden;
  border-radius:3px;border:1px solid rgba(201,160,106,.3);
  box-shadow:0 30px 74px rgba(0,0,0,.74);background:#0b0f16;margin:0 auto}
.widecar i{position:absolute;inset:0;background-size:cover;background-position:center 52%;
  transform:scale(1.1);clip-path:inset(0 100% 0 0)}
.scene.active .widecar i{animation:wipe 1.8s var(--ease) .45s forwards,
  slowzoom 26s ease-out .45s forwards}
.widecar b{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sepia);
  box-shadow:0 0 26px var(--sepia)}
.scene.active .widecar b{animation:sweep 1.8s var(--ease) .45s forwards}

/* --- カタログ紙面（横長・白背景の車両写真用） --- */
.platewide{position:relative;aspect-ratio:3/2;overflow:hidden;
  border:1px solid rgba(120,100,70,.35);
  box-shadow:0 26px 60px rgba(90,74,48,.34),inset 0 0 60px rgba(150,130,95,.18);
  background:#f3efe6}
.platewide i{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;
  background-position:center;mix-blend-mode:multiply;filter:sepia(.3) contrast(1.05);
  transform:scale(1.04);opacity:0}
.scene.active .platewide i{animation:fadezoom 2.4s var(--ease) .45s forwards}
.platewide .stamp{position:absolute;right:2.4%;bottom:4%;
  font-size:clamp(9px,.78vw,12px);letter-spacing:.24em;color:#8a7a5e;font-weight:700}

/* --- 未確認事項の明示（ドキュメンタリーとしての誠実さ） --- */
.todo{display:inline-block;margin-top:2.2vh;padding:.5em 1.1em;border:1px dashed rgba(201,160,106,.6);
  border-radius:6px;font-size:clamp(10px,.86vw,13px);letter-spacing:.1em;color:var(--sepia);
  font-weight:700;line-height:1.7}

/* --- 1967 年表グリッド --- */
.y67{width:min(1300px,94vw)}
.huge67{font-size:clamp(56px,9.2vw,148px);font-weight:900;line-height:.84;letter-spacing:-.045em;
  color:var(--sepia);text-shadow:0 0 60px rgba(201,160,106,.3);font-variant-numeric:tabular-nums}
.grid67{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(9px,1.2vw,17px);margin-top:3.2vh}
.enter67{display:inline-block;margin-top:3vh;padding:.8em 1.7em;border:1px solid var(--sepia);
  border-radius:999px;background:rgba(201,160,106,.14);font-weight:800;letter-spacing:.12em;
  font-size:clamp(12px,1.18vw,18px);backdrop-filter:blur(6px);
  animation:pulse 2.6s ease-out infinite}
@media(max-width:900px){ .grid67{grid-template-columns:1fr 1fr} }

/* --- 画面高さが低い環境：写真の縦横比(4:3)は保ち、全体を縮めて上段文字を切らさない --- */
@media(max-height:900px){
  .scene{padding-top:5.5vh;padding-bottom:6.5vh}
  .grid66,.grid67{margin-top:2vh}
  .y66,.y67{width:min(1120px,88vw)}
  .huge66,.huge67{font-size:clamp(52px,8.4vw,132px)}
}
@media(max-height:720px){
  .scene{padding-top:4vh;padding-bottom:5.5vh}
  .grid66,.grid67{margin-top:1.4vh}
  .y66,.y67{width:min(960px,80vw)}
  .head66{gap:clamp(12px,2vw,30px)}
}

/* --- 工場全景（航空写真・大判ワイプ） --- */
.airshot{position:relative;width:min(1300px,94vw);aspect-ratio:2048/1357;overflow:hidden;
  border-radius:3px;border:1px solid rgba(201,160,106,.32);
  box-shadow:0 34px 84px rgba(0,0,0,.78);background:#0b0f16;margin:0 auto}
.airshot i{position:absolute;inset:0;background-size:cover;background-position:center 52%;
  transform:scale(1.1);clip-path:inset(0 100% 0 0);filter:grayscale(1) contrast(1.08)}
.scene.active .airshot i{animation:wipe 2s var(--ease) .45s forwards,
  slowzoom 30s ease-out .45s forwards}
.airshot b{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sepia);
  box-shadow:0 0 26px var(--sepia)}
.scene.active .airshot b{animation:sweep 2s var(--ease) .45s forwards}
.airshot .ovl{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:3vh 2.4vw 2.4vh;
  background:linear-gradient(180deg,transparent,rgba(4,6,10,.88));text-align:left}
.airshot .ovl .t{font-size:clamp(15px,1.9vw,30px);font-weight:800;line-height:1.4;
  text-shadow:0 2px 16px rgba(0,0,0,.95)}
.airshot .ovl .s{font-size:clamp(10px,.9vw,14px);color:var(--sepia);letter-spacing:.22em;
  font-weight:800;margin-bottom:.8vh}

/* ================================================================
   [ADD-5] 序章オープニング  土埃（風に流れる粉塵）
   ================================================================ */
/* 畑の土から舞い上がる粗い塵：横へ流れる */
#dustfield{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0;
  transition:opacity 2.2s var(--ease)}
body.dustboost #dustfield{opacity:1}
.grit{position:absolute;border-radius:50%;background:rgba(226,206,168,.75);
  filter:blur(.3px);animation:blow linear infinite}
@keyframes blow{
  0%{transform:translate3d(-12vw,0,0) scale(.7);opacity:0}
  10%{opacity:.9}
  55%{transform:translate3d(48vw,-7vh,0) scale(1.05);opacity:.75}
  90%{opacity:.35}
  100%{transform:translate3d(116vw,-15vh,0) scale(1.2);opacity:0}}
/* 遠景にかかる砂塵の薄い帯 */
.haze{position:absolute;left:-20%;right:-20%;height:22vh;
  background:linear-gradient(90deg,transparent,rgba(214,192,152,.16) 35%,rgba(214,192,152,.10) 60%,transparent);
  filter:blur(22px);animation:hazeflow linear infinite}
@keyframes hazeflow{
  0%{transform:translateX(-30%);opacity:0}
  18%{opacity:.9}82%{opacity:.7}
  100%{transform:translateX(30%);opacity:0}}
/* 序章オープニングは既存の粉塵も濃くする */
body.dustboost #dust{opacity:.85}
body.dustboost #grain{opacity:.26}

/* ================================================================
   [ADD-6] 1968年章  4車種体制／価格帯グラフ
   ================================================================ */
:root{
  --y68-spr:url('assets/images/image_15.jpg');
  --y68-line:url('assets/images/image_16.jpg');
  --y68-minit:url('assets/images/image_17.jpg');
  --y68-miniv:url('assets/images/image_18.jpg');
}

/* --- 価格帯の横棒グラフ（ドキュメンタリー調） --- */
.pricechart{width:min(1120px,92vw);margin:3vh auto 0}
.prow{display:grid;grid-template-columns:clamp(88px,10vw,150px) 1fr clamp(76px,8vw,120px);
  align-items:center;gap:clamp(10px,1.6vw,26px);margin-bottom:clamp(10px,1.9vh,22px);
  opacity:0;transform:translateX(-22px)}
.prow.on{animation:prowIn .8s var(--ease) forwards}
@keyframes prowIn{to{opacity:1;transform:none}}
.prow .nm{text-align:right;font-weight:800;font-size:clamp(12px,1.3vw,21px);line-height:1.3}
.prow .nm small{display:block;font-weight:700;color:var(--sepia);letter-spacing:.14em;
  font-size:.66em;margin-top:.3em}
.prow .track{position:relative;height:clamp(20px,3.1vh,36px);border-radius:3px;
  background:rgba(255,255,255,.045);overflow:hidden}
.prow .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
  transition:width 1.5s cubic-bezier(.16,.84,.32,1)}
.prow.truck  .fill{background:linear-gradient(90deg,#4d5f77,#8ea3bd)}
.prow.small  .fill{background:linear-gradient(90deg,#6b5a3a,#cfa76e)}
.prow.main   .fill{background:linear-gradient(90deg,#8c0f20,var(--accent));
  box-shadow:0 0 30px rgba(224,17,43,.42)}
.prow.sport  .fill{background:linear-gradient(90deg,#b3132c,#ff6d80);
  box-shadow:0 0 34px rgba(255,109,128,.34)}
.prow .val{font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(13px,1.45vw,24px);text-align:left}
.prow .val em{font-style:normal;font-size:.62em;color:var(--sub);margin-left:.25em}

/* 平均年収の基準線（棒グラフのトラック列に重ねる） */
.pricechart{position:relative}
.incomeline{position:absolute;inset:0;pointer-events:none;
  display:grid;grid-template-columns:clamp(88px,10vw,150px) 1fr clamp(76px,8vw,120px);
  gap:clamp(10px,1.6vw,26px)}
.incomeline .mid{position:relative;grid-column:2}
.incomeline .bar{position:absolute;top:-.6vh;bottom:-.6vh;width:0;
  border-left:2px dashed var(--sepia);opacity:0}
.incomeline.on .bar{animation:fadeIn 1s ease 2.9s forwards}
@keyframes fadeIn{to{opacity:.9}}
.incomeline .lb{position:absolute;bottom:-5.2vh;transform:translateX(-50%);white-space:nowrap;
  font-size:clamp(9px,.84vw,13px);color:var(--sepia);font-weight:800;letter-spacing:.1em;
  opacity:0;text-align:center;line-height:1.6}
.incomeline.on .lb{animation:fadeIn 1s ease 3.2s forwards}

/* --- 4車種のサムネイル列 --- */
.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.2vw,18px);
  width:min(1240px,93vw);margin-top:3vh}
.lu{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:3px;
  border:1px solid rgba(201,160,106,.3);background:#0e1219;
  box-shadow:0 18px 44px rgba(0,0,0,.6);opacity:0;transform:translateY(18px)}
.scene.active .lu{animation:shIn .85s var(--ease) forwards}
.lu i{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;
  background-position:center;transform:scale(1.02)}
.lu.cover i{background-size:cover}
.lu:after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 46%,rgba(4,6,10,.92))}
.lu .tag{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;
  font-size:clamp(9px,.82vw,13px);font-weight:800;color:#eef1f6;line-height:1.55;
  text-shadow:0 2px 12px rgba(0,0,0,.95)}
.lu .tag small{display:block;font-weight:700;color:var(--sepia);letter-spacing:.18em;
  font-size:.78em;margin-bottom:.22em}
.lu.none{display:flex;align-items:center;justify-content:center;
  border-style:dashed;border-color:rgba(201,160,106,.45)}
.lu.none .ph{font-size:clamp(10px,.9vw,14px);color:var(--sepia);font-weight:800;
  letter-spacing:.12em;text-align:center;line-height:1.9;padding:0 1em}
@media(max-width:900px){
  .lineup{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:clamp(70px,20vw,110px) 1fr clamp(62px,16vw,90px)}
}

/* --- スプリンター（背景透過・影を落として置く） --- */
.lu.trans i{background-size:contain;background-position:center;filter:none}
.lu.trans{background:#efeae0}
.sh.trans i{background-size:contain;background-position:center;filter:none}
.sh.trans{background:#efeae0}
/* 大判の1台見せ（カタログ写真をフレームに収める） */
.solocar{position:relative;width:min(1100px,90vw);aspect-ratio:990/636;margin:0 auto;
  overflow:hidden;border-radius:3px;background:#f3efe6;
  border:1px solid rgba(201,160,106,.34);box-shadow:0 30px 74px rgba(0,0,0,.72);
  opacity:0;transform:translateY(16px)}
.solocar:before{content:"";position:absolute;inset:0;
  background-image:var(--y68-spr);background-size:contain;background-repeat:no-repeat;
  background-position:center;transform:scale(1.04)}
.scene.active .solocar{animation:soloIn 1.6s var(--ease) .45s forwards}
.scene.active .solocar:before{animation:slowzoom 24s ease-out .45s forwards}
@keyframes soloIn{to{opacity:1;transform:none}}

/* ================================================================
   [ADD-8] 音声ナレーション（Web Speech API）UI
   ================================================================ */
#btnVoice.on{background:var(--accent);border-color:var(--accent);color:#fff}
#btnVoice.on:after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;
  border-radius:50%;background:#fff;vertical-align:middle;animation:vpulse 1.3s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:.25}50%{opacity:1}}
/* 読み上げ中の行を明るく */
.narr p.reading{color:#fff;text-shadow:0 0 26px rgba(224,17,43,.4),0 3px 30px rgba(0,0,0,.9)}
body.papermode .narr p.reading{color:#1f1a14;text-shadow:none}


[hidden]{display:none!important}
#startOverlay{position:fixed;inset:0;z-index:200000;background:rgba(4,7,12,.88);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}
.startCard{text-align:center;max-width:720px;color:#f4f6f9}.startCard h2{font-size:clamp(30px,5vw,64px);line-height:1.4;margin:24px 0}.startCard p{line-height:1.9;color:#bbc2cd}.startLabel{letter-spacing:.18em}
#startFilm{margin:24px 0;padding:18px 40px;border:1px solid #e0112b;border-radius:8px;background:#c80f27;color:white;font-size:20px;cursor:pointer}.startHelp{font-size:13px}
#voiceMessage{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100001;max-width:85vw;color:white;background:#52222b;border-radius:8px}#voiceStatus:not([hidden]){display:inline-block;padding:12px}#retryVoice{margin:8px;padding:8px 14px}
.narr p{transition:opacity .35s,transform .35s}
#hint{top:62px;right:20px}
</style>
</head>
<body>

<div id="photoLayer"><div class="ph" id="ph"></div></div>
<div id="paper"></div>
<div id="tint"></div>
<div id="wash"></div>
<div id="vignette"></div>
<div id="dust"></div>
<div id="dustfield"></div>
<div id="grain"></div>
<div id="progress"></div>
<div id="brand">TAKAOKA PLANT 60th ANNIVERSARY</div>
<div id="hint">← → / SPACE ／ F=全画面</div>

<div id="road"></div>
<div id="car"></div>
<div id="stage"></div>
<div id="startOverlay"><div class="startCard"><p class="startLabel">高岡工場60周年記念史</p><h2>売れる未来を信じて<br>造った。</h2><p>ナレーション・BGM付きで再生します。</p><button id="startFilm">▶ はじめから再生</button><p class="startHelp">音声・BGMは個別に切り替えられます。<br>SPACE：一時停止 ／ ← →：場面移動 ／ F：全画面</p></div></div>
<div id="voiceMessage"><span id="voiceStatus" role="status" hidden></span><button id="retryVoice" hidden>再試行</button></div>

<div id="hud">
  <button id="btnPrev">◀ 前へ</button>
  <button id="btnPlay">▶ 自動再生</button>
  <button id="btnNext">次へ ▶</button>
  <span>速度 <button id="btnSpeed">×1.0</button></span>
  <button id="btnVoice" title="ナレーション音声の再生／停止">🔈 音声OFF</button>
  <span id="counter">01 / 39</span>
</div>

<script>
/* ================================================================
   [1] データ ―― ここだけ編集すれば内容が差し替わります
   ================================================================ */
const SALES = [
  {year:1955,v:27},{year:1957,v:34},{year:1960,v:53},

const stage=document.getElementById('stage'), ph=document.getElementById('ph'),
      wash=document.getElementById('wash'), tint=document.getElementById('tint'),
      paper=document.getElementById('paper'), car=document.getElementById('car'),
      road=document.getElementById('road'), progress=document.getElementById('progress'),
      counter=document.getElementById('counter'), btnPlay=document.getElementById('btnPlay'),
      btnSpeed=document.getElementById('btnSpeed');

let idx=0, playing=false, timer=null, speed=1.0, cmpRAF=null;
const els=[];
SCENES.forEach(s=>{const d=document.createElement('section');d.className='scene';
  d.innerHTML=s.html;stage.appendChild(d);els.push(d);});

const pad=n=>String(n).padStart(2,'0');
const DEFWASH='radial-gradient(120% 100% at 50% 0%,rgba(22,32,46,.32) 0%,rgba(6,8,12,.93) 68%)';
const CSS=getComputedStyle(document.documentElement);
const IMG={site:CSS.getPropertyValue('--p-site'),y1966:CSS.getPropertyValue('--p-1966'),
           now:CSS.getPropertyValue('--p-now')};

function applyBG(mode){
  document.body.classList.toggle('papermode', mode==='paper');
  paper.style.opacity = (mode==='paper') ? '1' : '0';
  if(mode==='paper'){ ph.style.opacity='0'; tint.style.opacity='0'; return; }

  if(mode==='illust'){
    /* 序章オープニング：イラストを主役に。暗くしすぎず、絵として見せる */
    ph.style.backgroundImage=IMG.site; ph.style.backgroundPosition='center 46%';
    ph.style.opacity='1'; ph.style.filter='grayscale(1) contrast(1.08) brightness(.88)';
    tint.style.opacity='.35';
  }else if(mode==='site'){
    ph.style.backgroundImage=IMG.site; ph.style.backgroundPosition='center 42%';
    ph.style.opacity='1'; ph.style.filter='contrast(1.05) saturate(.96) brightness(.66)';
    tint.style.opacity='1';
  }else if(mode==='1966'){
    ph.style.backgroundImage=IMG.y1966; ph.style.backgroundPosition='center 48%';
    ph.style.opacity='1'; ph.style.filter='grayscale(1) contrast(1.08) brightness(.52)';
    tint.style.opacity='1';
  }else if(mode==='now'){
    ph.style.backgroundImage=IMG.now; ph.style.backgroundPosition='center 50%';
    ph.style.opacity='1'; ph.style.filter='contrast(1.06) saturate(1.06) brightness(.62)';
    tint.style.opacity='.4';
  }else if(mode==='dim'){
    ph.style.opacity='.38'; ph.style.filter='grayscale(1) contrast(1.05) brightness(.32) blur(2px)';
    tint.style.opacity='.55';
  }else{
    ph.style.opacity='.09'; ph.style.filter='grayscale(1) brightness(.26) blur(7px)';
    tint.style.opacity='.22';
  }
}

function show(n){
  n=Math.max(0,Math.min(n,SCENES.length-1));
  if(cmpRAF){cancelAnimationFrame(cmpRAF);cmpRAF=null;}
  els.forEach(e=>e.classList.remove('active'));
  idx=n;
  const sc=SCENES[idx], el=els[idx];

  el.querySelectorAll('.rise,.blur,.node,.sep,.rule,.hrule,.stop,.frame i,.frame b,.platephoto i,.ev,.sh,.bleed66,.gatephoto i,.gatephoto b,.tallphoto i,.platewide i,.widecar i,.widecar b,.narr p,.chapmark .no,.chapmark .yr,.chapmark .ttl,.airshot i,.airshot b,.lu,.prow,.solocar')
    .forEach(x=>{x.style.animation='none'; void x.offsetWidth; x.style.animation='';});
  el.classList.add('active');

  applyBG(sc.bg);
  wash.style.background = sc.wash || DEFWASH;
  document.body.classList.toggle('dustboost', !!sc.dust);

  stopVoice();                 /* 前のシーンの読み上げを打ち切る */

  car.className=''; car.style.opacity='0'; road.style.opacity='0';
  if(sc.car){
    void car.offsetWidth;
    car.classList.add(sc.car);
    if(sc.bg==='now'||sc.bg==='1966') car.classList.add('dark');
    road.style.opacity='1';
  }

  counter.textContent=pad(idx+1)+' / '+pad(SCENES.length);
  progress.style.width=((idx+1)/SCENES.length*100)+'%';

  if(sc.anim==='counters') runCounters(el);
  if(sc.anim==='bars')     runBars(el);
  if(sc.anim==='flow')     runFlow(el);
  if(sc.anim==='rail')     runRail(el);
  if(sc.anim==='chart')    drawChart(el.querySelector('#chartHost'));
  if(sc.anim==='compare')  runCompare(el);
  if(sc.anim==='narration') runNarration(el);
  if(sc.anim==='prices')   runPrices(el);

  /* 音声ONのナレーション場面は読み上げ完了側から進める */
  loadSceneVoice();
}
/* ---- 数値カウントアップ ---- */
function runCounters(scope){
  scope.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count), dec=parseInt(el.dataset.dec||'0',10);
    const dur=1700, t0=performance.now();
    el.textContent=(0).toFixed(dec);
    function step(now){
      const p=Math.min((now-t0)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=(target*e).toFixed(dec);
      if(p<1) requestAnimationFrame(step);
    }
    setTimeout(()=>requestAnimationFrame(step),750);
  });
}
/* ---- 棒グラフ ---- */
function runBars(scope){
  scope.querySelectorAll('.stick').forEach((el,i)=>{
    el.style.height='0';
    setTimeout(()=>{el.style.height=(parseFloat(el.dataset.h)*0.78)+'%';},750+i*360);
  });
}
/* ---- フロー・レール順次点灯 ---- */
function runFlow(scope){
  scope.querySelectorAll('.node,.sep').forEach((el,i)=>{el.style.animationDelay=(0.5+i*0.28)+'s';});
}
function runRail(scope){
  scope.querySelectorAll('.rail .stop').forEach((el,i)=>{el.style.animationDelay=(0.9+i*0.35)+'s';});
}

/* ---- 価格帯グラフ（棒が順に伸びる／基準線は最後） ---- */
function runPrices(scope){
  const rows=scope.querySelectorAll('.prow');
  rows.forEach((r,i)=>{
    const fill=r.querySelector('.fill');
    r.classList.remove('on'); fill.style.width='0';
    r.style.animationDelay=(0.45+i*0.42)+'s';
    void r.offsetWidth;
    r.classList.add('on');
    setTimeout(()=>{ fill.style.width=r.dataset.w+'%'; }, 700+i*420);
  });
  /* 平均年収の基準線：最大値（58.7万円＝100%）に対する相対位置 */
  const inc=scope.querySelector('#pincome');
  if(inc){
    const pct=48.65/58.7*100;           /* 最大値58.7万円＝トラック幅100% */
    inc.querySelector('.bar').style.left=pct+'%';
    inc.querySelector('.lb').style.left=pct+'%';
    inc.classList.remove('on'); void inc.offsetWidth; inc.classList.add('on');
  }
}

/* ================================================================
   [ADD-8] 音声ナレーション ―― VOICEVOX:冥鳴ひまり 事前生成音声
   ・音声はこのHTMLにすべて内蔵。ネット接続不要
   ・字幕が立ち上がるタイミングに合わせて1行ずつ読み上げる
   ・実際の音声時間に字幕と場面転換を同期
   ================================================================ */
/* Pre-rendered VOICEVOX audio. No online speech service or OS voices. */
let voiceOn=true;
let narrationAudio=null, sceneTime=0, lastFrame=0, mediaWaiting=false;
let audioFailed=false, playToken=0;
const btnVoice=document.getElementById('btnVoice');
const statusEl=document.getElementById('voiceStatus');
const startOverlay=document.getElementById('startOverlay');
function stopVoice(){
  playToken++;
  if(narrationAudio){narrationAudio.pause();narrationAudio.removeAttribute('src');narrationAudio.load();}
  narrationAudio=null;mediaWaiting=false;audioFailed=false;
  document.dispatchEvent(new CustomEvent('narrationactivity',{detail:false}));
}
function hasVoice(){return !!NARRATION[idx]?.file;}
function updateButtons(){
  btnPlay.textContent=playing?'❚❚ 一時停止':'▶ 自動再生';
  btnVoice.textContent=voiceOn?'🔊 音声ON':'🔈 音声OFF';
  btnVoice.classList.toggle('on',voiceOn);
}
function voiceError(){
  mediaWaiting=false;audioFailed=true;playing=false;
  statusEl.textContent='音声を再生できません。「再試行」か、音声OFFで続けてください。ページを開き直して再度お試しください。';
  statusEl.hidden=false;document.getElementById('retryVoice').hidden=false;
  if(narrationAudio)narrationAudio.pause();
  document.dispatchEvent(new CustomEvent('presentationstate',{detail:false}));
  updateButtons();
}
function loadSceneVoice(){
  stopVoice();sceneTime=0;lastFrame=performance.now();
  statusEl.hidden=true;document.getElementById('retryVoice').hidden=true;
  if(hasVoice()){
    const a=new Audio(NARRATION[idx].file);narrationAudio=a;
    a.preload='auto';a.playbackRate=speed;a.preservesPitch=true;
    a.addEventListener('error',()=>{if(a===narrationAudio && voiceOn && playing)voiceError();});
    a.addEventListener('waiting',()=>{if(a===narrationAudio && voiceOn && playing)mediaWaiting=true;});
    a.addEventListener('playing',()=>{if(a===narrationAudio){mediaWaiting=false;lastFrame=performance.now();}});
    a.addEventListener('ended',()=>{if(a===narrationAudio){sceneTime=NARRATION[idx].duration;mediaWaiting=false;lastFrame=performance.now();}});
  }
  updateNarrationLines();
  if(playing)resumeSceneVoice();
}
function resumeSceneVoice(){
  if(!voiceOn || !narrationAudio || sceneTime>=NARRATION[idx].duration)return;
  const a=narrationAudio, token=++playToken;
  a.playbackRate=speed;
  try{a.currentTime=sceneTime;}catch(e){}
  mediaWaiting=true;
  a.play().then(()=>{
    if(token!==playToken || a!==narrationAudio)return;
    mediaWaiting=false;lastFrame=performance.now();
  }).catch(e=>{if(token===playToken && a===narrationAudio && e.name!=='AbortError')voiceError();});
}
function setPlaying(value){
  if(value && idx===SCENES.length-1 && sceneTime>=SCENES[idx].hold/1000){show(0);}
  playing=value;lastFrame=performance.now();
  if(value){startOverlay.hidden=true;resumeSceneVoice();}
  else{playToken++;if(narrationAudio)narrationAudio.pause();mediaWaiting=false;}
  document.dispatchEvent(new CustomEvent('presentationstate',{detail:value}));
  updateButtons();
}
function stopAuto(){setPlaying(false);}
function next(){show(idx+1);}
function prev(){show(idx-1);}
function updateNarrationLines(){
  const lines=els[idx].querySelectorAll('.narr p');
  const cues=NARRATION[idx]?.cues||[];
  lines.forEach((p,i)=>{
    const cue=cues[i];const t=voiceOn&&cue?cue.start:0.7+i*1.45;
    p.style.animation='none';p.style.opacity=sceneTime>=t?'1':'0';
    p.style.transform=sceneTime>=t?'none':'translateY(14px)';
    p.classList.toggle('reading',!!(voiceOn&&cue&&sceneTime>=cue.start&&sceneTime<cue.end));
  });
}
function runNarration(){} // The recorded speech clock now controls the text.
function frame(now){
  const dt=Math.min((now-lastFrame)/1000,0.25);lastFrame=now;
  if(playing&&!mediaWaiting){
    if(voiceOn&&narrationAudio&&!narrationAudio.ended&&sceneTime<NARRATION[idx].duration){
      sceneTime=narrationAudio.currentTime;
    }else sceneTime+=dt*speed;
    updateNarrationLines();
    const voiced=voiceOn&&hasVoice();
    const duration=Math.max(SCENES[idx].hold/1000,voiced?NARRATION[idx].duration+1.2:0);
    if(sceneTime>=duration){if(idx<SCENES.length-1)show(idx+1);else setPlaying(false);}
  }
  const speaking=playing&&voiceOn&&hasVoice()&&!mediaWaiting&&sceneTime<NARRATION[idx].duration;
  if(frame.speaking!==speaking){frame.speaking=speaking;document.dispatchEvent(new CustomEvent('narrationactivity',{detail:speaking}));}
  requestAnimationFrame(frame);
}
btnPlay.onclick=e=>{e.stopPropagation();setPlaying(!playing);};
document.getElementById('btnNext').onclick=e=>{e.stopPropagation();next();};
document.getElementById('btnPrev').onclick=e=>{e.stopPropagation();prev();};
const SPEEDS=[1.0,1.25,1.5,0.85];let sp=0;
btnSpeed.onclick=e=>{e.stopPropagation();sp=(sp+1)%SPEEDS.length;speed=SPEEDS[sp];
  btnSpeed.textContent='×'+speed; if(narrationAudio)narrationAudio.playbackRate=speed;};
btnVoice.onclick=e=>{e.stopPropagation();voiceOn=!voiceOn;
  if(!voiceOn){playToken++;if(narrationAudio)narrationAudio.pause();mediaWaiting=false;statusEl.hidden=true;document.getElementById('retryVoice').hidden=true;}
  else if(playing)resumeSceneVoice();
  updateNarrationLines();updateButtons();};
document.getElementById('retryVoice').onclick=e=>{e.stopPropagation();const t=sceneTime;loadSceneVoice();sceneTime=t;setPlaying(true);};
document.getElementById('startFilm').onclick=e=>{e.stopPropagation();setPlaying(true);window.startBgm?.();};
document.addEventListener('keydown',e=>{
  if(e.target.matches('button,input,select,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key===' '){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();}
  else if(e.key==='Home'){show(0);}
  else if(e.key==='End'){show(SCENES.length-1);}
});
stage.addEventListener('click',next);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false);});
window.addEventListener('beforeunload',()=>{if(narrationAudio)narrationAudio.pause();});
requestAnimationFrame(frame);updateButtons();


/* ---- 1966 / 2026 ワイプ比較（自動 + ドラッグ） ---- */
function runCompare(scope){
  const box=scope.querySelector('#cmp');
  if(!box) return;
  const after=box.querySelector('#cmpAfter'), handle=box.querySelector('#cmpHandle');
  let manual=false;
  function setPos(pct){
    pct=Math.max(0,Math.min(100,pct));
    after.style.clipPath=`inset(0 0 0 ${pct}%)`;
    handle.style.left=pct+'%';
  }
  setPos(100);
  const t0=performance.now();
  function auto(now){
    if(manual) return;
    const t=(now-t0)/1000;
    let pct;
    if(t<1.0) pct=100;
    else if(t<3.4) pct=100-(t-1.0)/2.4*100;
    else pct=50+Math.sin((t-3.4)*0.42)*38;
    setPos(pct);
    cmpRAF=requestAnimationFrame(auto);
  }
  cmpRAF=requestAnimationFrame(auto);
  function drag(e){
    manual=true;
    if(cmpRAF){cancelAnimationFrame(cmpRAF);cmpRAF=null;}
    const r=box.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    setPos(x/r.width*100);
  }
  let down=false;
  box.addEventListener('click',e=>e.stopPropagation());
  box.addEventListener('mousedown',e=>{down=true;drag(e);});
  window.addEventListener('mousemove',e=>{if(down)drag(e);});
  window.addEventListener('mouseup',()=>{down=false;});
  box.addEventListener('touchstart',e=>{drag(e);},{passive:true});
  box.addEventListener('touchmove',e=>{drag(e);},{passive:true});
}

/* ---- 折れ線グラフ ---- */
function drawChart(host){
  if(!host) return;
  const W=1000,H=420,ML=70,MR=40,MT=30,MB=60,iw=W-ML-MR,ih=H-MT-MB,maxV=250;
  const x=i=>ML+(i/(SALES.length-1))*iw, y=v=>MT+ih-(v/maxV)*ih;
  let grid='',ticks='';
  [0,50,100,150,200,250].forEach(v=>{
    grid+=`<line class="gridline" x1="${ML}" y1="${y(v)}" x2="${W-MR}" y2="${y(v)}"/>`;
    ticks+=`<text class="tick" x="${ML-14}" y="${y(v)+5}" text-anchor="end">${v}</text>`;});
  let xlab='',dots='',labels='';
  SALES.forEach((d,i)=>{
    xlab+=`<text class="tick" x="${x(i)}" y="${H-MB+28}" text-anchor="middle">${d.year}</text>`;
    dots+=`<circle class="dot" cx="${x(i)}" cy="${y(d.v)}" r="7" style="animation-delay:${0.9+i*0.28}s"/>`;
    labels+=`<text class="dotlabel" x="${x(i)}" y="${y(d.v)-20}" text-anchor="middle" style="animation-delay:${1.0+i*0.28}s">${d.v}万台</text>`;});
  const pts=SALES.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');
  const area=`${ML},${MT+ih} ${pts} ${x(SALES.length-1)},${MT+ih}`;
  const mi=SALES.findIndex(d=>d.year===1965);
  host.innerHTML=`
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="国内新車販売台数の推移">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0112b" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#e0112b" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <line class="axis" x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+ih}"/>
    <line class="axis" x1="${ML}" y1="${MT+ih}" x2="${W-MR}" y2="${MT+ih}"/>
    ${ticks}${xlab}
    <text class="tick" x="${ML}" y="${MT-10}" style="fill:#8c97a8">単位：万台（国内新車販売）</text>
    <polygon class="area" id="areaPoly" points="${area}"/>
    <polyline class="plotline" id="plotLine" points="${pts}"/>
    <line class="marker" id="mk" x1="${x(mi)}" y1="${MT}" x2="${x(mi)}" y2="${MT+ih}"/>
    <text class="markertext" id="mkt" x="${x(mi)+10}" y="${MT+20}">1965　高岡工場計画</text>
    ${dots}${labels}
  </svg>`;
  const line=host.querySelector('#plotLine'), len=line.getTotalLength();
  line.style.strokeDasharray=len; line.style.strokeDashoffset=len;
  line.getBoundingClientRect();
  line.style.transition='stroke-dashoffset 2.7s cubic-bezier(.16,.84,.32,1) .4s';
  line.style.strokeDashoffset='0';
  const ar=host.querySelector('#areaPoly');
  ar.style.transition='opacity 1.4s ease 1.9s'; ar.style.opacity='1';
  host.querySelectorAll('.dot,.dotlabel').forEach(el=>{el.style.animation='rise .6s var(--ease) forwards';});
  ['#mk','#mkt'].forEach(s=>{const el=host.querySelector(s);
    el.style.transition='opacity .8s ease 3.1s'; el.style.opacity='1';});
}

<!-- 高岡・静かな歳月：オリジナルBGM。ユーザー操作で再生開始。 -->
<div id="takaokaBgmPanel" style="position:fixed;right:18px;top:14px;z-index:99999;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(10,12,16,.75);color:#eee;border:1px solid #7776;border-radius:8px;font:12px sans-serif">
<button id="takaokaBgmToggle" style="color:inherit;background:transparent;border:0;cursor:pointer;font:inherit">♫ BGMを再生</button>
<input id="takaokaBgmVolume" aria-label="BGM音量" title="BGM音量" type="range" min="0" max="100" value="28" style="width:76px">
</div>
<script>
(()=>{const b=document.getElementById('takaokaBgmToggle'),v=document.getElementById('takaokaBgmVolume');let ctx,g,buf,source,on=false,busy=false,duck=false;
function applyVolume(){if(g)g.gain.setTargetAtTime(Number(v.value)/100*(duck?.35:1),ctx.currentTime,.22)}
document.addEventListener('narrationactivity',e=>{duck=e.detail;applyVolume();});
document.addEventListener('presentationstate',e=>{if(ctx&&on){if(e.detail)ctx.resume();else ctx.suspend();}});
window.startBgm=()=>{if(!on&&!busy)b.click();};
const bgmUrl='assets/audio/bgm.wav';
b.addEventListener('click',async e=>{e.stopPropagation();if(busy)return;busy=true;
try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();g=ctx.createGain();g.connect(ctx.destination);}
await ctx.resume();if(on){source.stop();source=null;on=false;b.textContent='♫ BGMを再生';}
else{if(!buf){b.textContent='読み込み中…';const response=await fetch(bgmUrl);if(!response.ok)throw new Error('BGM load failed');const arrayBuffer=await response.arrayBuffer();buf=await ctx.decodeAudioData(arrayBuffer);}
source=ctx.createBufferSource();source.buffer=buf;source.loop=true;source.loopStart=0;source.loopEnd=120;source.connect(g);g.gain.value=Number(v.value)/100*(duck?.35:1);source.start();on=true;b.textContent='Ⅱ BGMを停止';if(!playing)ctx.suspend();}}
catch(err){b.textContent='BGMを再試行';console.error(err);}finally{busy=false;}});
v.addEventListener('input',applyVolume);
for(const ev of ['click','pointerdown','keydown'])document.getElementById('takaokaBgmPanel').addEventListener(ev,e=>e.stopPropagation());
})();
</script>
